services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churn_user} -d ${POSTGRES_DB:-churn_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-churn_user}:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/${POSTGRES_DB:-churn_analytics}
      AIRFLOW__WEBSERVER__SECRET_KEY: local-demo-secret-change-before-sharing
      POSTGRES_DB: ${POSTGRES_DB:-churn_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-churn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command: -c "airflow db migrate && (airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Local --lastname Admin --role Admin --email admin@example.com || true)"
    restart: "on-failure"

  airflow-webserver:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "${AIRFLOW_EXTERNAL_PORT:-8081}:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
    restart: unless-stopped

volumes:
  postgres_data:
